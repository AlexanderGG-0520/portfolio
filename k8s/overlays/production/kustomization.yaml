apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/alexandergg-0520/portfolio
    digest: sha256:cc8dbcff71123d89a3d91139c853db0fd29221242e1e4cdffe995bd3f20afebc
patches:
