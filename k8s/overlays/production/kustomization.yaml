apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/alexandergg-0520/portfolio
    digest: sha256:e2cd0f43ec60fca19e1b6e0ed69d717ac8ee5c25b72858d0e397f490b709f93b
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: portfolio
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PORTFOLIO_ENVIRONMENT
          value: production
