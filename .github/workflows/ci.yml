name: CI

on:
  push:
    branches:
      - main
      - feat/three-design-prototypes
      - feat/signal-homepage
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify content authority boundaries
        shell: bash
        run: |
          if grep -R -F 'Local today. Kubernetes later.' frontend/src backend/cmd/server; then
            echo 'stale pre-Kubernetes deployment copy detected' >&2
            exit 1
          fi
          if grep -R -F '今はlocal。次はKubernetes。' frontend/src backend/cmd/server; then
            echo 'stale Japanese pre-Kubernetes deployment copy detected' >&2
            exit 1
          fi
          if grep -R -F 'Target runtime:' frontend/src backend/cmd/server; then
            echo 'runtime state must not be described as a future target' >&2
            exit 1
          fi

      - name: Verify dependency lock contract
        shell: bash
        run: |
          test -f frontend/package-lock.json
          grep -q '"lockfileVersion": 3' frontend/package-lock.json
          grep -q '"astro": "7.2.9"' frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Smoke test backend and static frontend
        shell: bash
        run: |
          cd backend
          PORTFOLIO_ENVIRONMENT=ci \
          PORTFOLIO_ORCHESTRATOR=process \
          PORTFOLIO_INSTANCE=github-actions \
          PORTFOLIO_REVISION="$GITHUB_SHA" \
            go run ./cmd/server -frontend ../frontend/dist > /tmp/portfolio-backend.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/api/profile | grep -q 'Minecartainer'
          curl --fail --silent http://127.0.0.1:8080/api/runtime | grep -q '"environment":"ci"'
          curl --fail --silent http://127.0.0.1:8080/api/runtime | grep -q '"instance":"github-actions"'
          curl --fail --silent http://127.0.0.1:8080/api/runtime | grep -q "$GITHUB_SHA"

          root_html="$(curl --fail --silent http://127.0.0.1:8080/)"
          printf '%s' "$root_html" | grep -q '/en/'
          printf '%s' "$root_html" | grep -q '/ja/'
          printf '%s' "$root_html" | grep -q 'name="robots" content="index,follow"'
          if printf '%s' "$root_html" | grep -qi 'noindex'; then
            echo 'public root must never contain noindex' >&2
            exit 1
          fi

          en_html="$(curl --fail --silent http://127.0.0.1:8080/en/)"
          printf '%s' "$en_html" | grep -q 'From code'
          printf '%s' "$en_html" | grep -q 'lang="en"'
          printf '%s' "$en_html" | grep -q 'name="robots" content="index,follow"'
          if printf '%s' "$en_html" | grep -qi 'noindex'; then
            echo '/en/ must never contain noindex' >&2
            exit 1
          fi
          printf '%s' "$en_html" | grep -q 'The architecture'
          printf '%s' "$en_html" | grep -q 'Home Kubernetes Platform'
          printf '%s' "$en_html" | grep -q 'Operational evidence is not'
          printf '%s' "$en_html" | grep -q 'The browser asks.'
          printf '%s' "$en_html" | grep -q 'Cloudflare Tunnel → ClusterIP Service'
          printf '%s' "$en_html" | grep -q 'Kubernetes is the current runtime.'
          printf '%s' "$en_html" | grep -q '/ja/'

          ja_html="$(curl --fail --silent http://127.0.0.1:8080/ja/)"
          printf '%s' "$ja_html" | grep -q 'lang="ja"'
          printf '%s' "$ja_html" | grep -q 'name="robots" content="index,follow"'
          if printf '%s' "$ja_html" | grep -qi 'noindex'; then
            echo '/ja/ must never contain noindex' >&2
            exit 1
          fi
          printf '%s' "$ja_html" | grep -q 'コードから'
          printf '%s' "$ja_html" | grep -q '一つのシステム'
          printf '%s' "$ja_html" | grep -q 'アーキテクチャを具体化する'
          printf '%s' "$ja_html" | grep -q '基盤ごと乗り換える'
          printf '%s' "$ja_html" | grep -q '運用の証拠はそうじゃない'
          printf '%s' "$ja_html" | grep -q 'ブラウザが問い'
          printf '%s' "$ja_html" | grep -q 'Cloudflare Tunnel → ClusterIP Service'
          printf '%s' "$ja_html" | grep -q 'Kubernetesが現在のruntime。'
          printf '%s' "$ja_html" | grep -q '/en/'

          curl --fail --silent http://127.0.0.1:8080/robots.txt | grep -q '^Allow: /$'

          printf '%s' "$en_html" | grep -q 'GET'
          printf '%s' "$en_html" | grep -q '/api/runtime'
          printf '%s' "$en_html" | grep -q '36c75dc'
          printf '%s' "$en_html" | grep -q '.server-install.json'
          printf '%s' "$en_html" | grep -q 'trace complete'
          printf '%s' "$en_html" | grep -q 'Software, through the infrastructure that runs it.'
          printf '%s' "$en_html" | grep -q 'id="mobile-navigation"'
          printf '%s' "$en_html" | grep -q 'data-mobile-nav-open'
          printf '%s' "$en_html" | grep -q 'data-view-mode-toggle'
          printf '%s' "$en_html" | grep -q 'data-view-mode-inspect'
          printf '%s' "$en_html" | grep -q 'data-inspect-detail'

          fastfetch="$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"command":"fastfetch"}' \
            http://127.0.0.1:8080/api/terminal)"
          printf '%s' "$fastfetch" | grep -q 'Environment:      ci'
          printf '%s' "$fastfetch" | grep -q 'Orchestrator:     process'
          printf '%s' "$fastfetch" | grep -q 'Instance:         github-actions'
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"command":"trace --system","cwd":"/"}' \
            http://127.0.0.1:8080/api/terminal | grep -q 'PHYSICAL FAILURE DOMAIN'
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"command":"runtime","cwd":"/"}' \
            http://127.0.0.1:8080/api/terminal | grep -q 'GET /api/runtime'

          design_a="$(curl --fail --silent http://127.0.0.1:8080/design/a/)"
          printf '%s' "$design_a" | grep -q 'Focus Pane'
          printf '%s' "$design_a" | grep -q 'name="robots" content="noindex,nofollow"'
          curl --fail --silent http://127.0.0.1:8080/design/b/ | grep -q 'Tiled Systems'
          curl --fail --silent http://127.0.0.1:8080/design/c/ | grep -q 'Signal Field'

      - name: Build container image
        shell: bash
        run: |
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg VERSION=ci \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$built_at" \
            --tag portfolio:ci \
            .

      - name: Smoke test container image
        shell: bash
        run: |
          docker run --rm --detach \
            --name portfolio-ci \
            --publish 127.0.0.1:18080:8080 \
            --env PORTFOLIO_ENVIRONMENT=ci \
            --env PORTFOLIO_ORCHESTRATOR=docker \
            --env PORTFOLIO_INSTANCE=github-actions \
            portfolio:ci
          trap 'docker rm -f portfolio-ci >/dev/null 2>&1 || true' EXIT

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/api/runtime | grep -q '"version":"ci"'
          curl --fail --silent http://127.0.0.1:18080/api/runtime | grep -q "\"revision\":\"$GITHUB_SHA\""
          curl --fail --silent http://127.0.0.1:18080/api/runtime | grep -q '"environment":"ci"'
          curl --fail --silent http://127.0.0.1:18080/api/runtime | grep -q '"orchestrator":"docker"'
          curl --fail --silent http://127.0.0.1:18080/en/ | grep -q 'From code'
          curl --fail --silent http://127.0.0.1:18080/en/ | grep -q 'name="robots" content="index,follow"'
          curl --fail --silent http://127.0.0.1:18080/ja/ | grep -q 'コードから'
          curl --fail --silent http://127.0.0.1:18080/ja/ | grep -q 'name="robots" content="index,follow"'
