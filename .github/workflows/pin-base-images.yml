name: Pin Docker base images

on:
  push:
    branches:
      - chore/dependency-locking

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve and pin base image digests
        shell: bash
        run: |
          set -euo pipefail

          resolve_digest() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'
          }

          node_digest="$(resolve_digest 'node:22-bookworm-slim')"
          go_digest="$(resolve_digest 'golang:1.24-bookworm')"
          runtime_digest="$(resolve_digest 'gcr.io/distroless/static-debian12:nonroot')"

          for digest in "$node_digest" "$go_digest" "$runtime_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid resolved digest: $digest" >&2
              exit 1
            fi
          done

          NODE_DIGEST="$node_digest" \
          GO_DIGEST="$go_digest" \
          RUNTIME_DIGEST="$runtime_digest" \
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('Dockerfile')
          text = path.read_text()
          replacements = {
              'FROM node:22-bookworm-slim AS frontend-build':
                  f"FROM node:22-bookworm-slim@{os.environ['NODE_DIGEST']} AS frontend-build",
              'FROM golang:1.24-bookworm AS backend-build':
                  f"FROM golang:1.24-bookworm@{os.environ['GO_DIGEST']} AS backend-build",
              'FROM gcr.io/distroless/static-debian12:nonroot AS runtime':
                  f"FROM gcr.io/distroless/static-debian12:nonroot@{os.environ['RUNTIME_DIGEST']} AS runtime",
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one Dockerfile line: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Verify pinned image builds
        shell: bash
        run: docker build --target frontend-build --tag portfolio-frontend-lockcheck .

      - name: Commit pinned Dockerfile and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile
          git rm .github/workflows/pin-base-images.yml
          git commit -m 'chore: pin Docker base images'
          git push origin HEAD:chore/dependency-locking
