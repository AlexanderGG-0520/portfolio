name: Generate frontend lockfile

on:
  push:
    branches:
      - chore/dependency-locking

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate package-lock.json
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m 'chore: lock frontend dependencies'
          git push origin HEAD:chore/dependency-locking
