name: Browser smoke

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
      - '.github/workflows/browser.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-engine browser smoke tests
        shell: bash
        run: |
          set -euo pipefail

          cd backend
          PORTFOLIO_ENVIRONMENT=ci \
          PORTFOLIO_ORCHESTRATOR=process \
          PORTFOLIO_INSTANCE=github-actions-browser \
          PORTFOLIO_REVISION="$GITHUB_SHA" \
            go run ./cmd/server -frontend ../frontend/dist > /tmp/portfolio-browser-backend.log 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/portfolio-browser-backend.log
            exit 1
          fi

          cd ../e2e
          npm test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-smoke
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
