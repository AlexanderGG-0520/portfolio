name: Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alexandergg-0520/portfolio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Alec Portfolio
            org.opencontainers.image.description=Backend / Infrastructure / Systems Engineering portfolio

      - name: Resolve build metadata
        id: build
        shell: bash
        run: |
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  promote:
    name: Promote production digest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.12'

      - name: Promote published digest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('k8s/overlays/production/kustomization.yaml')
          text = path.read_text()
          digest = os.environ['IMAGE_DIGEST']

          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit(f'invalid image digest: {digest!r}')

          updated, count = re.subn(
              r'(?m)^(\s*digest:\s*)sha256:[0-9a-f]{64}\s*$',
              lambda match: f'{match.group(1)}{digest}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected exactly one production digest field')

          path.write_text(updated)
          PY

      - name: Verify production manifest
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          kubectl kustomize k8s/overlays/production > /tmp/portfolio-production.yaml
          grep -Fq "ghcr.io/alexandergg-0520/portfolio@$IMAGE_DIGEST" /tmp/portfolio-production.yaml

      - name: Commit promotion
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          if git diff --quiet -- k8s/overlays/production/kustomization.yaml; then
            echo "Production already points at $IMAGE_DIGEST"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "chore(deploy): promote ${SOURCE_SHA:0:7} [skip ci]"
          git push origin HEAD:main
